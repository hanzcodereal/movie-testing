<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>muvie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #16132e;
  --surface: #211d45;
  --surface-2: #2c2757;
  --line: #3b3570;
  --text: #efecfa;
  --muted: #a39ecb;
  --accent: #ffb547;
  --accent-ink: #2a1c00;
  --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --pad: clamp(16px, 4vw, 48px);
  box-sizing: border-box;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

.bar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 14px var(--pad);
  background: rgba(22, 19, 46, 0.92);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  flex-wrap: wrap;
}
.logo {
  font-family: var(--display);
  font-weight: 800;
  font-size: 28px;
  letter-spacing: -0.03em;
  margin: 0;
  background: none;
  border: 0;
  padding: 0;
}
.logo i { color: var(--accent); font-style: normal; }
.tabs { display: flex; gap: 4px; }
.tab {
  background: none;
  border: 0;
  padding: 8px 14px;
  border-radius: 999px;
  color: var(--muted);
  font-weight: 600;
}
.tab:hover { color: var(--text); }
.tab[aria-pressed="true"] { background: var(--text); color: var(--bg); }
.search { margin-left: auto; flex: 1 1 220px; max-width: 360px; }
.search input {
  width: 100%;
  padding: 10px 16px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface);
}
.search input::placeholder { color: var(--muted); }

main { padding: 0 var(--pad) 80px; }

.hero {
  display: grid;
  grid-template-columns: 1fr;
  gap: 18px;
  padding: clamp(36px, 8vw, 96px) 0 clamp(28px, 5vw, 56px);
  max-width: 920px;
}
.hero h1 {
  font-family: var(--display);
  font-weight: 800;
  font-size: clamp(40px, 9vw, 104px);
  line-height: 0.95;
  letter-spacing: -0.04em;
  margin: 0;
  text-wrap: balance;
}
.hero p { margin: 0; color: var(--muted); max-width: 60ch; font-size: 18px; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; color: var(--muted); font-weight: 500; }
.score { color: var(--accent); font-weight: 700; }
.actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 6px; }
.btn {
  padding: 12px 22px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--surface);
  font-weight: 600;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { background: #ffc470; }

.row { margin-top: 40px; }
.row h2 {
  font-family: var(--display);
  font-weight: 700;
  font-size: 24px;
  letter-spacing: -0.02em;
  margin: 0 0 14px;
}
.scroller {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: clamp(140px, 17vw, 190px);
  gap: 14px;
  overflow-x: auto;
  padding-bottom: 12px;
  scroll-snap-type: x proximity;
  scrollbar-color: var(--line) transparent;
}
.scroller > * { scroll-snap-align: start; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 18px 14px;
}

.card { background: none; border: 0; padding: 0; text-align: left; display: block; width: 100%; }
.poster {
  position: relative;
  aspect-ratio: 2 / 3;
  border-radius: 10px;
  overflow: hidden;
  display: flex;
  align-items: flex-end;
  padding: 12px;
  background-size: cover;
  background-position: center;
  border: 1px solid var(--line);
}
.poster span {
  font-family: var(--display);
  font-weight: 800;
  font-size: 22px;
  line-height: 1;
  letter-spacing: -0.03em;
  text-wrap: balance;
  overflow-wrap: anywhere;
  display: -webkit-box;
  -webkit-line-clamp: 5;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.poster.img span { display: none; }
.card:hover .poster { border-color: var(--accent); }
.meta { margin-top: 8px; font-size: 14px; color: var(--muted); display: flex; gap: 10px; justify-content: space-between; }
.name {
  margin-top: 8px;
  font-weight: 600;
  font-size: 15px;
  line-height: 1.3;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.meta { margin-top: 2px; }
.badge { color: var(--accent); font-weight: 600; }

.state {
  max-width: 520px;
  margin: 12vh auto 0;
  text-align: center;
  display: grid;
  gap: 14px;
  justify-items: center;
}
.state h2 { font-family: var(--display); font-size: 32px; letter-spacing: -0.03em; margin: 0; }
.state p { color: var(--muted); margin: 0; }
.state code { background: var(--surface); padding: 2px 8px; border-radius: 6px; }
.file { position: relative; }
.file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }

.count { color: var(--muted); margin: 28px 0 16px; }

dialog {
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--text);
  padding: 0;
  width: min(960px, 96vw);
  max-height: 94vh;
  border-radius: 16px;
  overflow: hidden;
}
dialog::backdrop { background: rgba(8, 6, 22, 0.8); }
.sheet { max-height: 94vh; overflow-y: auto; padding: clamp(20px, 4vw, 40px); }
.close {
  position: absolute;
  top: 12px;
  right: 12px;
  z-index: 2;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--surface);
  font-size: 20px;
  line-height: 1;
}
.sheet h2 {
  font-family: var(--display);
  font-weight: 800;
  font-size: clamp(30px, 6vw, 56px);
  line-height: 1;
  letter-spacing: -0.035em;
  margin: 0 40px 14px 0;
  text-wrap: balance;
}
.pills { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
.pill { border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; font-size: 14px; color: var(--muted); }
.desc { max-width: 68ch; color: #d8d4f0; }
.sheet h3 { font-family: var(--display); font-size: 20px; margin: 28px 0 12px; letter-spacing: -0.02em; }
video { width: 100%; max-height: 62vh; background: #000; border-radius: 12px; display: block; }
.qs { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 0; }
.q {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 10px;
  padding: 8px 14px;
  font-weight: 600;
}
.q small { color: var(--muted); font-weight: 400; margin-left: 6px; }
.q[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.q[aria-pressed="true"] small { color: var(--accent-ink); }
.seasons { display: grid; gap: 8px; }
.season {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  padding: 12px 16px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
}
.season span:last-child { color: var(--muted); }
.note { color: var(--muted); }
.out { display: inline-block; margin-top: 10px; color: var(--accent); }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
}
@media (max-width: 640px) {
  .search { order: 3; max-width: none; flex-basis: 100%; margin-left: 0; }
  .tabs { overflow-x: auto; }
}
</style>
</head>
<body>
<header class="bar">
  <button class="logo" id="home" aria-label="Beranda muvie">mu<i>v</i>ie</button>
  <nav class="tabs" id="tabs" aria-label="Kategori">
    <button class="tab" data-tab="all" aria-pressed="true">Semua</button>
    <button class="tab" data-tab="movie" aria-pressed="false">Film</button>
    <button class="tab" data-tab="series" aria-pressed="false">Series</button>
    <button class="tab" data-tab="drama" aria-pressed="false">Drama</button>
  </nav>
  <div class="search">
    <input id="q" type="search" placeholder="Cari judul atau genre" aria-label="Cari judul atau genre" autocomplete="off">
  </div>
</header>

<main id="app"></main>

<dialog id="detail" aria-label="Detail judul">
  <button class="close" id="close" aria-label="Tutup">×</button>
  <div class="sheet" id="sheet"></div>
</dialog>

<script>
const app = document.getElementById('app');
const dlg = document.getElementById('detail');
const sheet = document.getElementById('sheet');
const input = document.getElementById('q');

const S = { data: null, items: new Map(), sets: { movie: new Set(), series: new Set(), drama: new Set() }, tab: 'all', q: '' };

const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const genres = (g) => (Array.isArray(g) ? g : String(g || '').split(/[,/|]/)).map((x) => String(x).trim()).filter(Boolean);
const rate = (r) => (r === null || r === undefined || r === '' || isNaN(Number(r)) ? '' : Number(r).toFixed(1));

function hue(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
  return h;
}

function tint(title) {
  const h = hue(title || '');
  return `linear-gradient(160deg, hsl(${h} 58% 34%), hsl(${(h + 48) % 360} 62% 15%))`;
}

function addItem(i) {
  if (!i || !i.path) return;
  const old = S.items.get(i.path) || {};
  S.items.set(i.path, {
    path: i.path,
    title: i.title || old.title,
    type: i.type || old.type,
    year: i.year || old.year,
    rating: i.rating ?? old.rating,
    genre: i.genre || old.genre,
    poster: i.poster || old.poster,
  });
}

function ingest(d) {
  S.data = d;
  S.items.clear();
  for (const k of d.kategori || []) for (const i of k.items || []) addItem(i);
  for (const t of ['movie', 'series', 'drama']) {
    S.sets[t] = new Set();
    for (const i of (d.daftar && d.daftar[t]) || []) {
      addItem(i);
      S.sets[t].add(i.path);
    }
  }
  for (const q of Object.keys(d.search || {})) for (const i of d.search[q].items || []) addItem(i);
  for (const [p, x] of Object.entries(d.detail || {})) {
    addItem({
      path: p,
      title: x.title,
      year: x.year,
      rating: x.rating,
      genre: x.genre,
      poster: x.poster,
      type: S.items.has(p) ? undefined : x.isEpisodic ? 'Series' : 'Movie',
    });
  }
}

function inTab(i) {
  if (S.tab === 'all') return true;
  if (S.sets[S.tab].has(i.path)) return true;
  const t = String(i.type || '');
  if (S.tab === 'movie') return /movie|film/i.test(t);
  if (S.tab === 'series') return /series|tv|anime/i.test(t);
  return false;
}

function matches(i) {
  if (!S.q) return true;
  const hay = (i.title + ' ' + genres(i.genre).join(' ')).toLowerCase();
  return S.q.toLowerCase().split(/\s+/).every((w) => hay.includes(w));
}

function card(i) {
  const r = rate(i.rating);
  const img = i.poster ? ` img" style="background-image:url('${esc(i.poster)}')` : `" style="background-image:${tint(i.title)}`;
  return `<button class="card" data-path="${esc(i.path)}">
    <div class="poster${img}"><span>${esc(i.title)}</span></div>
    <div class="name">${esc(i.title)}</div>
    <div class="meta"><span>${esc(i.year || '')}</span>${r ? `<span class="badge">${r}</span>` : ''}</div>
  </button>`;
}

function heroItem() {
  const h = S.data.home || {};
  const p = h.detailPath || h.path;
  if (p && S.items.has(p)) return S.items.get(p);
  let best = null;
  for (const i of S.items.values()) {
    if (S.data.detail && S.data.detail[i.path] && S.data.detail[i.path].desc && (!best || Number(i.rating) > Number(best.rating))) best = i;
  }
  return best || [...S.items.values()][0];
}

function renderEmpty() {
  app.innerHTML = `<section class="state">
    <h2>Data belum ada</h2>
    <p>Jalankan <code>npm run scrape</code> sampai muncul <code>hasil-full.json</code>, taruh di folder yang sama dengan halaman ini, lalu muat ulang. Atau pilih filenya langsung dari perangkat.</p>
    <span class="btn primary file">Pilih hasil-full.json<input type="file" id="pick" accept="application/json,.json"></span>
  </section>`;
  document.getElementById('pick').addEventListener('change', async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    try {
      ingest(JSON.parse(await f.text()));
      render();
    } catch {
      alert('File tidak bisa dibaca. Pastikan isinya JSON hasil scrape.');
    }
  });
}

function render() {
  if (!S.data) return renderEmpty();
  const browsing = S.tab !== 'all' || S.q;

  if (browsing) {
    const list = [...S.items.values()].filter((i) => inTab(i) && matches(i)).sort((a, b) => (Number(b.rating) || 0) - (Number(a.rating) || 0));
    app.innerHTML = list.length
      ? `<p class="count">${list.length} judul</p><div class="grid">${list.map(card).join('')}</div>`
      : `<section class="state"><h2>Tidak ada hasil</h2><p>Coba kata kunci lain atau pilih kategori Semua.</p></section>`;
    return;
  }

  const h = heroItem();
  const hd = h && S.data.detail ? S.data.detail[h.path] : null;
  let out = '';
  if (h) {
    const r = rate(h.rating);
    out += `<section class="hero">
      <h1>${esc(h.title)}</h1>
      <div class="facts">${r ? `<span class="score">★ ${r}</span>` : ''}${h.year ? `<span>${esc(h.year)}</span>` : ''}${hd && hd.duration ? `<span>${esc(hd.duration)}</span>` : ''}${genres(h.genre).slice(0, 3).map((g) => `<span>${esc(g)}</span>`).join('')}</div>
      ${hd && hd.desc ? `<p>${esc(hd.desc.length > 260 ? hd.desc.slice(0, 257) + '…' : hd.desc)}</p>` : ''}
      <div class="actions"><button class="btn primary" data-path="${esc(h.path)}">Tonton sekarang</button></div>
    </section>`;
  }
  for (const k of S.data.kategori || []) {
    const items = (k.items || []).map((i) => S.items.get(i.path)).filter(Boolean);
    if (!items.length) continue;
    out += `<section class="row"><h2>${esc(k.title)}</h2><div class="scroller">${items.map(card).join('')}</div></section>`;
  }
  app.innerHTML = out || `<section class="state"><h2>Belum ada judul</h2><p>Hasil scrape kosong. Jalankan ulang scraper.</p></section>`;
}

let current = null;

function openDetail(path) {
  const i = S.items.get(path);
  const d = S.data.detail && S.data.detail[path];
  if (!i && !d) return;
  current = path;
  const t = (d && d.title) || i.title;
  const r = rate((d && d.rating) ?? (i && i.rating));
  const subs = d && d.subtitles ? (Array.isArray(d.subtitles) ? d.subtitles : [d.subtitles]).map((s) => (typeof s === 'string' ? s : s.language || s.lang || s.name || '')).filter(Boolean) : [];
  const streams = (d && d.stream) || [];

  let h = `<h2>${esc(t)}</h2>
    <div class="facts">${r ? `<span class="score">★ ${r}${d && d.ratingCount ? ` (${esc(d.ratingCount)})` : ''}</span>` : ''}
    ${(d && d.year) || (i && i.year) ? `<span>${esc((d && d.year) || i.year)}</span>` : ''}
    ${d && d.duration ? `<span>${esc(d.duration)}</span>` : ''}
    ${d && d.country ? `<span>${esc(d.country)}</span>` : ''}
    ${d && d.isEpisodic && d.totalEpisodes ? `<span>${esc(d.totalEpisodes)} episode</span>` : ''}</div>
    <div class="pills">${genres((d && d.genre) || (i && i.genre)).map((g) => `<span class="pill">${esc(g)}</span>`).join('')}</div>
    ${d && d.desc ? `<p class="desc">${esc(d.desc)}</p>` : ''}`;

  if (!d) {
    h += `<p class="note">Detail judul ini belum ikut ter-scrape. Jalankan ulang scraper untuk melengkapinya.</p>`;
  } else if (streams.length) {
    h += `<h3>Tonton</h3>
      <video id="vid" controls playsinline preload="metadata" src="${esc(streams[0].url)}"></video>
      <div class="qs" id="qs">${streams.map((s, n) => `<button class="q" data-n="${n}" aria-pressed="${n === 0}">${esc(s.quality || 'Auto')}${s.size ? `<small>${esc(s.size)}</small>` : ''}</button>`).join('')}</div>
      <a class="out" id="ext" href="${esc(streams[0].url)}" target="_blank" rel="noopener">Buka di tab baru</a>`;
  } else {
    h += `<h3>Tonton</h3><p class="note">Link tonton belum tersedia untuk judul ini.</p>`;
  }

  if (d && d.seasons && d.seasons.length) {
    h += `<h3>Season</h3><div class="seasons">${d.seasons.map((s) => {
      const n = Array.isArray(s.episodes) ? s.episodes.length : s.episodes || s.maxEpisode;
      const res = Array.isArray(s.resolutions) ? s.resolutions.map((x) => (typeof x === 'object' ? x.resolution || x.quality || '' : x)).filter(Boolean).join(', ') : s.resolutions || '';
      return `<div class="season"><span>Season ${esc(s.season)}</span><span>${esc(n || '?')} episode${res ? ` · ${esc(res)}` : ''}</span></div>`;
    }).join('')}</div>`;
  }

  if (subs.length) h += `<h3>Subtitle</h3><div class="pills">${subs.map((s) => `<span class="pill">${esc(s)}</span>`).join('')}</div>`;

  sheet.innerHTML = h;
  sheet.scrollTop = 0;

  const qs = document.getElementById('qs');
  if (qs) {
    qs.addEventListener('click', (e) => {
      const b = e.target.closest('.q');
      if (!b) return;
      const s = streams[Number(b.dataset.n)];
      const v = document.getElementById('vid');
      const t0 = v.currentTime;
      v.src = s.url;
      v.currentTime = t0;
      v.play().catch(() => {});
      document.getElementById('ext').href = s.url;
      qs.querySelectorAll('.q').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    });
  }

  if (!dlg.open) dlg.showModal();
  if (location.hash !== '#/t/' + encodeURIComponent(path)) history.pushState(null, '', '#/t/' + encodeURIComponent(path));
}

function closeDetail() {
  const v = document.getElementById('vid');
  if (v) { v.pause(); v.removeAttribute('src'); v.load(); }
  if (dlg.open) dlg.close();
  current = null;
}

dlg.addEventListener('close', () => {
  const v = document.getElementById('vid');
  if (v) { v.pause(); v.removeAttribute('src'); v.load(); }
  if (current !== null) {
    current = null;
    history.pushState(null, '', location.pathname + location.search);
  }
});
dlg.addEventListener('click', (e) => { if (e.target === dlg) closeDetail(); });
document.getElementById('close').addEventListener('click', closeDetail);

app.addEventListener('click', (e) => {
  const c = e.target.closest('[data-path]');
  if (c) openDetail(c.dataset.path);
});

document.getElementById('tabs').addEventListener('click', (e) => {
  const b = e.target.closest('.tab');
  if (!b) return;
  S.tab = b.dataset.tab;
  document.querySelectorAll('.tab').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  render();
  window.scrollTo(0, 0);
});

let timer;
input.addEventListener('input', () => {
  clearTimeout(timer);
  timer = setTimeout(() => { S.q = input.value.trim(); render(); }, 150);
});

document.getElementById('home').addEventListener('click', () => {
  S.tab = 'all';
  S.q = '';
  input.value = '';
  document.querySelectorAll('.tab').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.tab === 'all')));
  render();
  window.scrollTo(0, 0);
});

function fromHash() {
  const m = location.hash.match(/^#\/t\/(.+)$/);
  if (m && S.data) openDetail(decodeURIComponent(m[1]));
  else if (dlg.open) { current = null; dlg.close(); }
}
window.addEventListener('popstate', fromHash);

async function load() {
  for (const f of ['hasil-full.json', 'hasil-progress.json']) {
    try {
      const r = await fetch(f, { cache: 'no-cache' });
      if (!r.ok) continue;
      ingest(await r.json());
      break;
    } catch {}
  }
  render();
  fromHash();
}

app.innerHTML = '<p class="count">Memuat…</p>';
load();
</script>
</body>
</html>
